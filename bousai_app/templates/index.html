{% extends "base.html" %}

{% block content %}
<!-- 避難所マップ -->
<div class="section">
  <h2 class="section-title">
    <span class="section-title-icon">📍</span>
    避難所マップ
  </h2>
  <div id="shelterMap" style="height: 350px;"></div>
</div>

<!-- 気象警報・注意報 -->
<div class="section">
  <div class="warning-header">
    <h2 class="section-title">
      <span class="section-title-icon">⛅</span>
      青森市 気象警報・注意報
    </h2>
    <div class="update-info">
      <span>♻</span>
      10分おき自動更新
    </div>
  </div>
  <div id="weatherContent" class="warning-content">
    <p>読み込み中...</p>
  </div>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（藤沢市周辺を中心に設定）
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<div style="margin-bottom: 15px;">';
            data.warnings.forEach(warning => {
                warningsHtml += `<div class="status-row"><span class="status-check">⚠️</span><span>${warning.name}（${warning.status}）</span></div>`;
            });
            warningsHtml += '</div>';
        } else {
            warningsHtml = `<div class="status-row"><span class="status-check">✓</span><span>現在、警報・注意報は発表されていません</span></div>`;
        }

        weatherContent.innerHTML = `
            <div class="warning-area">
              <span class="area-icon">📍</span>
              <span>${data.area_name || '青森市'}</span>
            </div>
            ${warningsHtml}
            <div class="info-row">
              <span class="info-icon">🕐</span>
              <span>データ取得: ${data.last_fetch_time || '更新中...'}</span>
            </div>
            <div class="info-row">
              <span class="info-icon">📡</span>
              <span>気象庁発表: ${data.report_time || '不明'}</span>
            </div>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
